<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9 - do while</title>
</head>

<body>
    <script type="text/javascript">
        var i = 0;
        do {
            document.write("The number is " + i);
            document.write("<br>");
            i++;
        }
        while (i <= 5);
    </script>
</body>

</html>
