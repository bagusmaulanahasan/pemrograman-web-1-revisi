<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 1.5em;
            align-items: center;
            width: 350px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        form {
            display: flex;
            align-items: center;
            flex-direction: column;
            gap: 1em;
        }
        .inputs {
            display: flex;
            gap: 1em;
        }
        input {
            width: 80px;
            padding: 5px;
        }
        button {
            background-color: #4c7daf;
            padding: 8px;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #3e6f9d;
        }
        .result {
            width: 100%;
            height: .9em;
            margin-top: 20px;
            padding: 10px;
            font-size: 18px;
            text-align: center;
            background-color: #f9f9f9;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Kalkulator Sederhana</h2>
        <form id="calculatorForm">
            <div class="inputs">
                <input type="number" id="num1" placeholder="Masukkan angka pertama" required>
                <select id="operator" required>
                    <option value="">Pilih Operasi</option>
                    <option value="divide">Bagi (÷)</option>
                    <option value="multiply">Kali (×)</option>
                    <option value="add">Tambah (+)</option>
                    <option value="subtract">Kurang (-)</option>
                </select>
                <input type="number" id="num2" placeholder="Masukkan angka kedua" required>
            </div>
            <button type="button" onclick="calculate()">Hitung</button>
        </form>
        <div class="result" id="result"></div>
    </div>

    <script>
        function calculate() {
            const num1 = parseFloat(document.getElementById('num1').value);
            const num2 = parseFloat(document.getElementById('num2').value);
            const operator = document.getElementById('operator').value;
            let result = '';

            if (isNaN(num1) || isNaN(num2)) {
                result = 'Harap masukkan angka yang valid!';
            } else {
                switch (operator) {
                    case 'add':
                        result = `Hasil: ${num1 + num2}`;
                        break;
                    case 'subtract':
                        result = `Hasil: ${num1 - num2}`;
                        break;
                    case 'multiply':
                        result = `Hasil: ${num1 * num2}`;
                        break;
                    case 'divide':
                        if (num2 === 0) {
                            result = 'Kesalahan: Tidak dapat membagi dengan 0!';
                        } else {
                            result = `Hasil: ${num1 / num2}`;
                        }
                        break;
                    default:
                        result = 'Harap pilih operasi matematika!';
                }
            }

            document.getElementById('result').innerText = result;
        }
    </script>
</body>
</html>
